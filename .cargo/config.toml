[profile.dev]
incremental = true

[profile.release]
debug = false
incremental = false
strip = "symbols"
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.release.build-override]
opt-level = 3
codegen-units = 1

[build]
rustflags = ["-C", "embed-bitcode=no"]
rustc-wrapper = "sccache"

# Parallel compilation
[env]
CARGO_BUILD_JOBS = "8"
