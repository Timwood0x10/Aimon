name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v0.1.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  PROJECT_NAME: aimon

jobs:
  build-and-release:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
        
    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-build-target-

    - name: Run tests
      run: cargo test --verbose

    - name: Build release
      run: cargo build --release --verbose

    - name: Test release binary
      run: |
        chmod +x scripts/test-release.sh
        ./scripts/test-release.sh

    - name: Get version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION=${GITHUB_REF#refs/tags/}
        fi
        echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
        echo "VERSION_NUMBER=${VERSION#v}" >> $GITHUB_OUTPUT

    - name: Validate Cargo version
      run: |
        CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "aimon") | .version')
        test "${CARGO_VERSION}" = "${{ steps.version.outputs.VERSION_NUMBER }}"

    - name: Validate release notes
      run: test -s RELEASE.md

    - name: Create distribution package
      run: |
        chmod +x scripts/build-release.sh
        ./scripts/build-release.sh

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.VERSION }}
        name: Aimon ${{ steps.version.outputs.VERSION }}
        body_path: RELEASE.md
        draft: false
        prerelease: false
        files: |
          dist/${{ env.PROJECT_NAME }}-${{ steps.version.outputs.VERSION }}-macos.tar.gz
          dist/${{ env.PROJECT_NAME }}-${{ steps.version.outputs.VERSION }}-checksums.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PROJECT_NAME }}-${{ steps.version.outputs.VERSION }}
        path: |
          dist/
          release-builds/
        retention-days: 30
