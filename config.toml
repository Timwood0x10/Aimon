# System Alert Configuration File

refresh_rate = 1
minimal_mode = false

[thresholds]
cpu_warning = 75.0
cpu_critical = 90.0
memory_warning = 75
memory_critical = 90
temperature_warning = 70.0
temperature_critical = 85.0

[display]
show_temperatures = true
show_network = true
show_processes = true
show_history = true
history_size = 60
# Available themes: cyberpunk, nord, dracula, tokyo_night, monokai, solarized_dark, gruvbox, catppuccin, one_dark, matrix_neon, mactop_green, gold_pro
theme = "gold_pro"

[notifications]
enabled = true
cooldown_seconds = 30